<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="login">
        <form class="login__form" action="#" method="POST">
            <h2 class="login__title">Iniciar Sesión</h2>
            <div class="login__group">
                <label for="email" class="login__label">Correo Electrónico</label>
                <input type="email" id="email" class="login__input" name="email">
            </div>
            <div class="login__group">
                <label for="password" class="login__label">Contraseña</label>
                <input type="password" id="password" class="login__input" name="password">
            </div>
            <button type="button" class="login__button" onclick="window.location.href='Pagina Principal.html'">Ingresar</button>
            <p class="login__register">¿No tienes cuenta? <a href="Signup.html">Regístrate</a></p>
        </form>
    </div>
</body>
</html>
